apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jyotsanaarora/kustomize-app-of-apps.git
    targetRevision: main
    path: apps/guestbook/overlays/prod-east
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook-east
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
